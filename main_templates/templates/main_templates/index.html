<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Shield Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-300 font-sans flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <i class="fa-solid fa-shield-halved text-emerald-500 text-2xl mr-3"></i>
            <span class="text-white text-lg font-bold tracking-wider">Identity Shield</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center px-4 py-3 bg-emerald-500/10 text-emerald-400 rounded-lg">
                <i class="fa-solid fa-chart-line w-6"></i> Dashboard
            </a>
            <a href="#" class="flex items-center px-4 py-3 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                <i class="fa-solid fa-triangle-exclamation w-6"></i> Threat Alerts
            </a>
            <a href="#" class="flex items-center px-4 py-3 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                <i class="fa-solid fa-globe w-6"></i> Dark Web Monitor
            </a>
            <a href="#" class="flex items-center px-4 py-3 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
                <i class="fa-solid fa-gear w-6"></i> Settings
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        
        <!-- Top Header -->
        <header class="h-16 flex items-center justify-between px-8 bg-slate-900/50 border-b border-slate-800">
            <h1 class="text-xl font-semibold text-white">Overview</h1>
            <div class="flex items-center space-x-4">
                <button class="relative p-2 text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-bell"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div class="w-8 h-8 bg-slate-700 rounded-full border border-slate-600"></div>
            </div>
        </header>

        <!-- Dashboard Widgets -->
        <div class="p-8 space-y-6">
            
            <!-- Main Status Card -->
            <div class="bg-gradient-to-r from-emerald-900/50 to-slate-900 border border-emerald-500/30 rounded-2xl p-6 flex items-center justify-between shadow-lg">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-2">Protection is Active</h2>
                    <p class="text-emerald-400/80">Your identity and linked accounts are currently secure.</p>
                </div>
                <div class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center border border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                    <i class="fa-solid fa-check text-2xl text-emerald-400"></i>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-slate-400 font-medium">Scanned Records</h3>
                        <i class="fa-solid fa-database text-blue-400"></i>
                    </div>
                    <p class="text-3xl font-bold text-white">14.2M</p>
                    <p class="text-sm text-slate-500 mt-2">Past 30 days</p>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-slate-400 font-medium">Data Leaks Found</h3>
                        <i class="fa-solid fa-user-secret text-red-400"></i>
                    </div>
                    <p class="text-3xl font-bold text-white">0</p>
                    <p class="text-sm text-emerald-400 mt-2">No action required</p>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="text-slate-400 font-medium">Active Monitors</h3>
                        <i class="fa-solid fa-eye text-purple-400"></i>
                    </div>
                    <p class="text-3xl font-bold text-white">5</p>
                    <p class="text-sm text-slate-500 mt-2">Emails, SSN, Phone</p>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
