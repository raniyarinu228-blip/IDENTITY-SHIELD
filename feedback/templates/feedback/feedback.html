<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Shield - Submit Feedback</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #0b1120;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-shield: #38bdf8;
      --accent-hover: #0284c7;
      --accent-star: #f59e0b;
      --accent-green: #10b981;
      --border-color: #334155;
      --input-bg: #0f172a;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    /* Header Section */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--accent-shield);
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .brand-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Main Card */
    .card {
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i.left-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .input-wrapper input,
    .input-wrapper textarea {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper textarea {
      padding-top: 12px;
      resize: vertical;
      min-height: 110px;
    }

    .input-wrapper input:read-only {
      color: var(--accent-shield);
      font-weight: 600;
      cursor: not-allowed;
      border-style: dashed;
    }

    .input-wrapper input:focus,
    .input-wrapper textarea:focus {
      border-color: var(--accent-shield);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    /* Star Rating System */
    .rating-container {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .star-rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      gap: 10px;
    }

    .star-rating input[type="radio"] {
      display: none;
    }

    .star-rating label {
      font-size: 1.8rem;
      color: var(--border-color);
      cursor: pointer;
      transition: color 0.2s, transform 0.1s;
      margin-bottom: 0;
    }

    /* Hover & Active Effects for Star Rating */
    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input[type="radio"]:checked ~ label {
      color: var(--accent-star);
    }

    .star-rating label:hover {
      transform: scale(1.15);
    }

    .rating-text {
      font-size: 0.85rem;
      color: var(--accent-shield);
      font-weight: 500;
    }

    /* Action Buttons Row */
    .btn-row {
      display: flex;
      gap: 16px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-reset {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .btn-reset:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .btn-submit {
      background-color: var(--accent-shield);
      color: var(--bg-primary);
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn:active {
      transform: scale(0.99);
    }

    /* Security Status Badge */
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--radius-sm);
      color: var(--accent-green);
      font-size: 0.8rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="brand-header">
      <div class="brand-icon">
        <i class="fa-solid fa-comment-dots"></i>
      </div>
      <h1>Identity Shield</h1>
      <p>User Experience & Feedback Portal</p>
    </div>

    <!-- Feedback Form Card -->
    <div class="card">
      <form id="feedbackForm" onsubmit="handleFeedbackSubmit(event)">
        
        <!-- Feedback ID (Auto-Generated) -->
        <div class="form-group">
          <label for="feedbackId">Feedback ID</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-hashtag left-icon"></i>
            <input type="text" id="feedbackId" value="FB-2026-40182" readonly title="Auto-generated Feedback Reference ID">
          </div>
        </div>

        <!-- Rating Section (1 to 5 Stars) -->
        <div class="form-group">
          <label>Rating (1 to 5)</label>
          <div class="rating-container">
            <div class="star-rating">
              <input type="radio" id="star5" name="rating" value="5" required onclick="updateRatingLabel('5 - Excellent Security & Experience')">
              <label for="star5" title="5 Stars"><i class="fa-solid fa-star"></i></label>

              <input type="radio" id="star4" name="rating" value="4" onclick="updateRatingLabel('4 - Good Experience')">
              <label for="star4" title="4 Stars"><i class="fa-solid fa-star"></i></label>

              <input type="radio" id="star3" name="rating" value="3" onclick="updateRatingLabel('3 - Average / Satisfactory')">
              <label for="star3" title="3 Stars"><i class="fa-solid fa-star"></i></label>

              <input type="radio" id="star2" name="rating" value="2" onclick="updateRatingLabel('2 - Needs Improvement')">
              <label for="star2" title="2 Stars"><i class="fa-solid fa-star"></i></label>

              <input type="radio" id="star1" name="rating" value="1" onclick="updateRatingLabel('1 - Poor Experience')">
              <label for="star1" title="1 Star"><i class="fa-solid fa-star"></i></label>
            </div>
            <div class="rating-text" id="ratingLabel">Select your rating score</div>
          </div>
        </div>

        <!-- Feedback Description -->
        <div class="form-group">
          <label for="feedbackDescription">Feedback Description</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-pen-to-square left-icon" style="top: 20px;"></i>
            <textarea id="feedbackDescription" placeholder="Share your experience, feature requests, or suggestions to improve Identity Shield..." required></textarea>
          </div>
        </div>

        <!-- Buttons Row -->
        <div class="btn-row">
          <button type="reset" class="btn btn-reset" onclick="resetRatingLabel()">
            <i class="fa-solid fa-rotate-left"></i> Reset
          </button>
          <button type="submit" class="btn btn-submit">
            <i class="fa-solid fa-paper-plane"></i> Submit Feedback
          </button>
        </div>

      </form>

      <!-- Security Status Badge -->
      <div class="security-badge">
        <i class="fa-solid fa-shield-heart"></i> Thank you for helping us make Identity Shield safer!
      </div>
    </div>
  </div>

  <script>
    // Dynamically update rating description text
    function updateRatingLabel(text) {
      document.getElementById('ratingLabel').innerText = text;
    }

    // Reset rating label on form reset
    function resetRatingLabel() {
      document.getElementById('ratingLabel').innerText = "Select your rating score";
    }

    // Form Submit Handler
    function handleFeedbackSubmit(event) {
      event.preventDefault();

      const feedbackId = document.getElementById('feedbackId').value;
      const selectedRating = document.querySelector('input[name="rating"]:checked');
      const ratingValue = selectedRating ? selectedRating.value : 'Not selected';
      const description = document.getElementById('feedbackDescription').value;

      alert(`Feedback Submitted Successfully!\n\nFeedback ID: ${feedbackId}\nRating: ${ratingValue}/5 Stars\nMessage: ${description}`);
    }
  </script>

</body>
</html>
