<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyo - Profile</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #f5f5f5;
            min-height: 100vh;
        }

        /* Top Navigation Header */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 30px;
            background: #11151c;
            border-bottom: 1px solid #1e2633;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .brand-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .search-bar {
            background: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 20px;
            padding: 8px 16px;
            width: 320px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            width: 100%;
            font-size: 0.9rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            background: #1a202c;
            border: none;
            color: #a0aec0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .icon-btn:hover {
            color: #fff;
            background: #2d3748;
        }

        /* Profile Layout Container */
        .profile-page-wrapper {
            max-width: 950px;
            margin: 25px auto;
            padding: 0 20px;
        }

        /* Upper Profile Header Card */
        .profile-card {
            background: radial-gradient(circle at top right, #1f293d, #11151c);
            border: 1px solid #1e2638;
            border-radius: 18px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .avatar-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .user-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
        }

        .user-handle {
            font-size: 0.9rem;
            color: #8b98a5;
            margin-top: 2px;
            margin-bottom: 12px;
        }

        .user-tags {
            font-size: 0.9rem;
            color: #ccd6e0;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-bio {
            font-size: 0.88rem;
            color: #a0aec0;
            margin-bottom: 20px;
        }

        .profile-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-edit {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: #fff;
        }

        .btn-security {
            background: #1e2638;
            color: #e2e8f0;
            border: 1px solid #2d3748;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #11151c;
            border: 1px solid #1e2638;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            display: block;
        }

        .stat-title {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 2px;
        }

        /* Identity Protection Banner */
        .security-banner {
            background: #0f1c18;
            border: 1px solid #10b98133;
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .security-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .shield-icon {
            width: 38px;
            height: 38px;
            background: #10b98122;
            color: #10b981;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .security-text h4 {
            font-size: 0.95rem;
            color: #ffffff;
            font-weight: 600;
        }

        .security-text p {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 2px;
        }

        .view-link {
            color: #a0aec0;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Tabs */
        .content-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #1e2638;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            background: transparent;
            border: none;
            color: #718096;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-button.active {
            background: #1e2638;
            color: #ffffff;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .grid-item {
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            background: #1a202c;
            border: 1px solid #1e2638;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        .modal-content {
            background: #11151c;
            border: 1px solid #1e2638;
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1e2638;
            padding-bottom: 12px;
        }

        .modal-header h3 {
            color: #ffffff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #8b98a5;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover { color: #ffffff; }

        .avatar-upload-section {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
        }

        .modal-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #6366f1;
        }

        .upload-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #6366f1;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            border: 2px solid #11151c;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: #8b98a5;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #6366f1;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: #1e2638;
            color: #a0aec0;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="top-navbar">
        <div class="brand-logo">
            <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
            Keyo
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color: #718096;"></i>
            <input type="text" placeholder="Search Keyo...">
        </div>
        <div class="header-actions">
                       <button class="icon-btn" title="Settings"><i class="fa-solid fa-gears"></i></button>
        </div>
    </header>

    <!-- Main Profile Container -->
    <main class="profile-page-wrapper">
        
        <!-- Profile Details Card -->
        <section class="profile-card">
            <div class="avatar-wrapper">
                <img src="https://i.pravatar.cc/150?img=47" class="profile-avatar" id="profile-img" alt="Avatar">
            </div>

            <h2 class="user-name" id="display-name">Raniya</h2>
            <div class="user-handle" id="user-handle">@raniya_keyo</div>

            <div class="user-tags" id="user-tags">
                Student • BCA <i class="fa-solid fa-graduation-cap"></i>
            </div>
            
            <p class="user-bio" id="user-bio">
                Exploring technology & creativity ✨ <br>
                <i class="fa-solid fa-lock"></i> Privacy matters.
            </p>

            <div class="profile-buttons">
                <button class="btn btn-edit" onclick="openEditModal()">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Edit Profile
                </button>
                <button class="btn btn-security" onclick="alert('Keyo Identity Security Settings Active')">
                    <i class="fa-solid fa-shield-halved"></i> Security
                </button>
            </div>
        </section>

        <!-- Stats Grid -->
        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-number">42</span>
                <span class="stat-title">Posts</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">486</span>
                <span class="stat-title">Friends</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">1.8K</span>
                <span class="stat-title">Followers</span>
            </div>
            <div class="stat-card">
                <span class="stat-number">620</span>
                <span class="stat-title">Following</span>
            </div>
        </section>

        <!-- Security Banner -->
        <section class="security-banner">
            <div class="security-info">
                <div class="shield-icon"><i class="fa-solid fa-shield-cat"></i></div>
                <div class="security-text">
                    <h4>Identity Protection Active</h4>
                    <p>Your account is being monitored for possible impersonation.</p>
                </div>
            </div>
            <a href="#" class="view-link">View →</a>
        </section>

        <!-- Content Tabs -->
        <nav class="content-tabs">
            <button class="tab-button active" onclick="switchTab('posts', event)">
                <i class="fa-solid fa-border-all"></i> Posts
            </button>
            <button class="tab-button" onclick="switchTab('photos', event)">
                <i class="fa-solid fa-image"></i> Photos
            </button>
            <button class="tab-button" onclick="switchTab('videos', event)">
                <i class="fa-solid fa-play"></i> Videos
            </button>
        </nav>

        <!-- Tab Panels -->
        <div id="panel-posts" class="tab-panel active">
            <div class="media-grid">
                <div class="grid-item"><img src="https://picsum.photos/400/300?random=10" alt="Post"></div>
                <div class="grid-item"><img src="https://picsum.photos/400/300?random=11" alt="Post"></div>
                <div class="grid-item"><img src="https://picsum.photos/400/300?random=12" alt="Post"></div>
            </div>
        </div>

        <div id="panel-photos" class="tab-panel">
            <div class="media-grid">
                <div class="grid-item"><img src="https://picsum.photos/400/300?random=13" alt="Photo"></div>
                <div class="grid-item"><img src="https://picsum.photos/400/300?random=14" alt="Photo"></div>
            </div>
        </div>

        <div id="panel-videos" class="tab-panel">
            <div class="media-grid">
                <div class="grid-item"><img src="https://picsum.photos/400/300?random=15" alt="Video preview"></div>
            </div>
        </div>

    </main>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> Edit Profile</h3>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>

            <form id="edit-profile-form" onsubmit="saveProfileChanges(event)">
                <div class="avatar-upload-section">
                    <img id="avatar-preview" src="https://i.pravatar.cc/150?img=47" class="modal-avatar" alt="Avatar Preview">
                    <label for="avatar-input" class="upload-badge">
                        <i class="fa-solid fa-camera"></i>
                    </label>
                    <input type="file" id="avatar-input" accept="image/*" onchange="previewNewAvatar(event)" hidden>
                </div>

                <div class="form-group">
                    <label for="edit-name">Display Name</label>
                    <input type="text" id="edit-name" value="Raniya" required>
                </div>

                <div class="form-group">
                    <label for="edit-handle">Username Handle</label>
                    <input type="text" id="edit-handle" value="@raniya_keyo" required>
                </div>

                <div class="form-group">
                    <label for="edit-tags">Course / Role</label>
                    <input type="text" id="edit-tags" value="Student • BCA" required>
                </div>

                <div class="form-group">
                    <label for="edit-bio">Bio</label>
                    <textarea id="edit-bio" rows="3">Exploring technology & creativity ✨&#10;Privacy matters.</textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Handlers -->
    <script>
        // Modal Control Functions
        function openEditModal() {
            const modal = document.getElementById('edit-profile-modal');
            if (modal) {
                // Populate modal inputs with current UI content
                document.getElementById('edit-name').value = document.getElementById('display-name').innerText;
                document.getElementById('edit-handle').value = document.getElementById('user-handle').innerText;
                document.getElementById('avatar-preview').src = document.getElementById('profile-img').src;

                modal.classList.add('active');
            }
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-profile-modal');
            if (modal) {
                modal.classList.remove('active');
            }
        }

        // Live Image Preview
        function previewNewAvatar(evt) {
            const file = evt.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatar-preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Save Form Data to Page DOM
        function saveProfileChanges(evt) {
            evt.preventDefault();

            const newName = document.getElementById('edit-name').value;
            const newHandle = document.getElementById('edit-handle').value;
            const newTags = document.getElementById('edit-tags').value;
            const newBio = document.getElementById('edit-bio').value;
            const newAvatar = document.getElementById('avatar-preview').src;

            // DOM Updates
            if (newName) document.getElementById('display-name').innerText = newName;
            if (newHandle) document.getElementById('user-handle').innerText = newHandle;
            if (newAvatar) document.getElementById('profile-img').src = newAvatar;

            if (newTags) {
                document.getElementById('user-tags').innerHTML = `${newTags} <i class="fa-solid fa-graduation-cap"></i>`;
            }

            if (newBio) {
                document.getElementById('user-bio').innerHTML = `${newBio.replace(/\n/g, '<br>')} <br><i class="fa-solid fa-lock"></i> Privacy matters.`;
            }

            closeEditModal();
        }

        // Tab Switching Function
        function switchTab(tabName, evt) {
            const panels = document.querySelectorAll('.tab-panel');
            panels.forEach(p => {
                p.classList.remove('active');
                p.style.display = 'none';
            });

            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(b => b.classList.remove('active'));

            const target = document.getElementById('panel-' + tabName);
            if (target) {
                target.classList.add('active');
                target.style.display = 'block';
            }

            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }
        }
    </script>
</body>
</html>
