<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Shield - Register Account</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #0b1120;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-shield: #38bdf8;
      --accent-hover: #0284c7;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --border-color: #334155;
      --input-bg: #0f172a;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* Header Section */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--accent-shield);
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .brand-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Main Card */
    .card {
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i.left-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper input:read-only {
      color: var(--accent-shield);
      font-weight: 600;
      cursor: not-allowed;
      border-style: dashed;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-shield);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Terms and Conditions Row */
    .terms-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 22px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .terms-group input {
      accent-color: var(--accent-shield);
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
    }

    .terms-group a {
      color: var(--accent-shield);
      text-decoration: none;
    }

    .terms-group a:hover {
      text-decoration: underline;
    }

    /* Register Button */
    .btn-register {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-shield);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-register:hover {
      background-color: var(--accent-hover);
    }

    .btn-register:active {
      transform: scale(0.99);
    }

    /* Security Status Badge */
    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--radius-sm);
      color: var(--accent-green);
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* Footer Login Link */
    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .btn-login {
      display: inline-block;
      margin-left: 6px;
      color: var(--accent-shield);
      text-decoration: none;
      font-weight: 600;
    }

    .btn-login:hover {
      text-decoration: underline;
    }

    .error-msg {
      color: var(--accent-red);
      font-size: 0.78rem;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="brand-header">
      <div class="brand-icon">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h1>Identity Shield</h1>
      <p>Create Your Secure Identity Profile</p>
    </div>

    <!-- Registration Card -->
    <div class="card">
      <form id="registerForm" onsubmit="handleRegistration(event)">
        
        <!-- Register ID Field (Auto-Generated Unique Identifier) -->
        <div class="form-group">
          <label for="registerId">Register ID</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-card left-icon"></i>
            <input type="text" id="registerId" value="IS-2026-8942" readonly title="Auto-generated unique Shield ID">
          </div>
        </div>

        <!-- Username Field -->
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user left-icon"></i>
            <input type="text" id="username" placeholder="Enter username" required>
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope left-icon"></i>
            <input type="email" id="email" placeholder="name@example.com" required>
          </div>
        </div>

        <!-- Mobile Number Field -->
        <div class="form-group">
          <label for="mobile">Mobile No.</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-phone left-icon"></i>
            <input type="tel" id="mobile" placeholder="+1 234 567 8900" pattern="[0-9+\s\-]{8,15}" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock left-icon"></i>
            <input type="password" id="password" placeholder="Create password" required>
            <i class="fa-solid fa-eye toggle-pwd" id="pwdToggle" onclick="togglePassword('password', 'pwdToggle')"></i>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield-halved left-icon"></i>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            <i class="fa-solid fa-eye toggle-pwd" id="confirmPwdToggle" onclick="togglePassword('confirmPassword', 'confirmPwdToggle')"></i>
          </div>
          <span class="error-msg" id="passwordMismatch">Passwords do not match!</span>
        </div>

        <!-- Terms and Conditions Checkbox -->
        <div class="terms-group">
          <input type="checkbox" id="terms" required>
          <label for="terms">
            I agree to the <a href="/login/login/" onclick="showTerms(event)">Terms and Conditions</a> and Privacy Policy.
          </label>
        </div>

        <!-- Register Button -->
        <button type="submit" class="btn-register">
          <i class="fa-solid fa-user-plus"></i> Register
        </button>

      </form>

      <!-- Security Status Badge -->
      <div class="security-badge">
        <i class="fa-solid fa-shield-cat"></i> Zero-Trust Encrypted Identity Creation
      </div>
    </div>

    <!-- Already Have An Account & Login Button Section -->
    <div class="card-footer">
      <span>Already have an account?</span>
      <a href="/login/login/" class="btn-login">Login</a>
    </div>
  </div>

  <script>
    // Toggle Password Visibility
    function togglePassword(inputId, toggleIconId) {
      const pwdInput = document.getElementById(inputId);
      const pwdToggle = document.getElementById(toggleIconId);

      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdToggle.className = 'fa-solid fa-eye-slash toggle-pwd';
      } else {
        pwdInput.type = 'password';
        pwdToggle.className = 'fa-solid fa-eye toggle-pwd';
      }
    }

    // Handle Form Submit and Validation
    function handleRegistration(event) {
      event.preventDefault();

      const pwd = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirmPassword').value;
      const errorMsg = document.getElementById('passwordMismatch');

      if (pwd !== confirmPwd) {
        errorMsg.style.display = 'block';
        return;
      } else {
        errorMsg.style.display = 'none';
      }

      const registerId = document.getElementById('registerId').value;
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;

      alert(`Registration Successful!\n\nRegister ID: ${registerId}\nUsername: ${username}\nEmail: ${email}`);
    }

    // Modal / Alert for Terms
    function showTerms(event) {
      event.preventDefault();
      alert("Identity Shield Terms:\n1. Your data is protected by AES-256 encryption.\n2. Do not share your Register ID or Master Password with anyone.");
    }

    // Login button handler
    function handleLoginRedirect(event) {
      event.preventDefault();
      alert("Redirecting to Login Page...");
    }
  </script>

</body>
</html>
