<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyo - Secure Portal Login</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #0b1120;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-shield: #38bdf8;
      --accent-hover: #0284c7;
      --accent-green: #10b981;
      --border-color: #334155;
      --input-bg: #0f172a;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    /* Header Section */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--accent-shield);
      margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .brand-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Main Card */
    .card {
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i.left-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .input-wrapper input,
    .input-wrapper select {
      width: 100%;
      padding: 12px 42px 12px 42px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
    }

    .input-wrapper select {
      cursor: pointer;
    }

    .input-wrapper i.arrow-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
      border-color: var(--accent-shield);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Form Options Row */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .remember-me input {
      accent-color: var(--accent-shield);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--accent-shield);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Login Button */
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-shield);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-login:hover {
      background-color: var(--accent-hover);
    }

    .btn-login:active {
      transform: scale(0.99);
    }

    /* Footer Register Link */
    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .btn-register {
      display: inline-block;
      margin-left: 6px;
      color: var(--accent-shield);
      text-decoration: none;
      font-weight: 600;
    }

    .btn-register:hover {
      text-decoration: underline;
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--radius-sm);
      color: var(--accent-green);
      font-size: 0.8rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="brand-header">
      <div class="brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1>Keyo</h1>
      <p>Secure Access Authentication Portal</p>
    </div>

    <!-- Login Card -->
    <div class="card">
      <form id="loginForm" onsubmit="handleLogin(event)">
        
        <!-- Email / Username Field -->
        <div class="form-group">
          <label for="identity">Email or Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user left-icon"></i>
            <input type="text" id="identity" placeholder="Enter email or username" required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock left-icon"></i>
            <input type="password" id="password" placeholder="Enter password" required>
            <i class="fa-solid fa-eye toggle-pwd" id="pwdToggle" onclick="togglePasswordVisibility()"></i>
          </div>
        </div>

        <!-- User Type Field -->
        <div class="form-group">
          <label for="userType">User Type</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-users-gear left-icon"></i>
            <select id="userType" required>
              <option value="" disabled selected>Select user role</option>
              <option value="student">Student / Regular User</option>
              <option value="admin">Administrator</option>
              <option value="security_officer">Security Officer</option>
            </select>
            <i class="fa-solid fa-chevron-down arrow-icon"></i>
          </div>
        </div>

        <!-- Remember Me & Forgot Password Row -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot Password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-login">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>

      </form>

      <!-- Security Status Badge -->
      <div class="security-badge">
        <i class="fa-solid fa-circle-check"></i> Keyo Protection Active
      </div>
    </div>

    <!-- Don't have an account & Register Button Section -->
    <div class="card-footer">
      <span>Don't have an account?</span>
      <a href="/user/register/" class="btn-register" >Register</a>
    </div>
  </div>

  <script>
    // Password visibility toggle
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const pwdToggle = document.getElementById('pwdToggle');

      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdToggle.className = 'fa-solid fa-eye-slash toggle-pwd';
      } else {
        pwdInput.type = 'password';
        pwdToggle.className = 'fa-solid fa-eye toggle-pwd';
      }
    }

    // Form submit handler
    function handleLogin(event) {
      event.preventDefault();
      const identity = document.getElementById('identity').value;
      const userType = document.getElementById('userType').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      alert(`Login Successful!\nIdentity: ${identity}\nRole: ${userType}\nRemember Me: ${rememberMe}`);
    }

    // Forgot password handler
    function handleForgotPassword(event) {
      event.preventDefault();
      alert("Redirecting to password reset flow...");
    }

    // Register button handler
    function handleRegisterRedirect(event) {
      event.preventDefault();
      alert("Redirecting to the registration page...");
    }
  </script>

</body>
</html>
