<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Shield - Manage Connections</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --bg-card: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-shield: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --border-color: #475569;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Navigation Header */
    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background-color: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand i {
      font-size: 1.8rem;
      color: var(--accent-shield);
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .shield-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Main Section */
    main {
      width: 100%;
      max-width: 1000px;
    }

    /* Tabs Navigation */
    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .tab-btn {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-shield);
    }

    .tab-btn.active {
      background-color: var(--accent-shield);
      color: var(--bg-primary);
      border-color: var(--accent-shield);
    }

    .badge-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    .tab-btn.active .badge-count {
      background: rgba(15, 23, 42, 0.2);
    }

    /* Action Bar (Search & Add Friend) */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-bar {
      position: relative;
      flex: 1;
      min-width: 280px;
    }

    .search-bar i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-bar input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent-shield);
    }

    /* Tab Content Areas */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Friend List Container */
    .friends-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .friend-item {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .friend-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px -5px rgba(0, 0, 0, 0.4);
    }

    .friend-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-container {
      position: relative;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-shield);
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      position: absolute;
      bottom: 2px;
      right: 2px;
      border: 2px solid var(--bg-surface);
    }

    .status-online { background-color: var(--accent-green); }
    .status-offline { background-color: var(--text-muted); }

    .details h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .details p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--accent-shield);
      background-color: var(--bg-card);
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }

    /* Actions Section */
    .item-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-accept {
      background-color: var(--accent-green);
      color: var(--bg-primary);
    }

    .btn-reject {
      background-color: var(--bg-card);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-block {
      background-color: var(--bg-card);
      color: var(--accent-amber);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .btn-unblock {
      background-color: var(--accent-shield);
      color: var(--bg-primary);
    }

    .btn-remove {
      background-color: var(--bg-card);
      color: var(--text-muted);
    }

    /* Add Friend Card Component */
    .add-friend-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
    }

    .add-friend-card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-input-group {
      display: flex;
      gap: 12px;
    }

    .add-input-group input {
      flex: 1;
      padding: 12px 16px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      outline: none;
    }

    .add-input-group input:focus {
      border-color: var(--accent-shield);
    }

    .btn-send {
      background-color: var(--accent-shield);
      color: var(--bg-primary);
      padding: 0 20px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: var(--border-color);
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-shield-halved"></i>
      <h1>Identity Shield</h1>
    </div>
    <div class="shield-status">
      <i class="fa-solid fa-user-lock"></i> Connection Manager Active
    </div>
  </header>

  <!-- Main Container -->
  <main>
    <!-- Add Friend by Shield ID -->
    <div class="add-friend-card">
      <h2><i class="fa-solid fa-user-plus" style="color: var(--accent-shield)"></i> Add Friend via Shield ID</h2>
      <div class="add-input-group">
        <input type="text" id="addShieldInput" placeholder="Enter Shield ID (e.g., IS-902142)">
        <button class="btn btn-send" onclick="sendFriendRequest()">
          <i class="fa-solid fa-paper-plane"></i> Send Request
        </button>
      </div>
    </div>

    <!-- Management Navigation Tabs -->
    <div class="tabs-container">
      <button class="tab-btn active" onclick="switchTab('active')">
        <i class="fa-solid fa-user-group"></i> Active Connections 
        <span class="badge-count" id="activeCount">2</span>
      </button>
      <button class="tab-btn" onclick="switchTab('pending')">
        <i class="fa-solid fa-clock"></i> Pending Requests 
        <span class="badge-count" id="pendingCount">1</span>
      </button>
      <button class="tab-btn" onclick="switchTab('blocked')">
        <i class="fa-solid fa-ban"></i> Shielded / Blocked 
        <span class="badge-count" id="blockedCount">1</span>
      </button>
    </div>

    <!-- Controls / Filter -->
    <div class="action-bar">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search connection by name or handle..." onkeyup="filterConnections()">
      </div>
    </div>

    <!-- TAB 1: ACTIVE FRIENDS -->
    <div class="tab-content active" id="tab-active">
      <div class="friends-list" id="activeList"></div>
    </div>

    <!-- TAB 2: PENDING REQUESTS -->
    <div class="tab-content" id="tab-pending">
      <div class="friends-list" id="pendingList"></div>
    </div>

    <!-- TAB 3: BLOCKED CONNECTIONS -->
    <div class="tab-content" id="tab-blocked">
      <div class="friends-list" id="blockedList"></div>
    </div>
  </main>

  <script>
    // State Management: Friends Data
    let connections = [
      {
        id: 1,
        name: "Alex Morgan",
        handle: "@alex_m",
        shieldId: "IS-902142",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
        status: "active",
        online: true
      },
      {
        id: 2,
        name: "David Chen",
        handle: "@d_chen",
        shieldId: "IS-482019",
        avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80",
        status: "active",
        online: false
      },
      {
        id: 3,
        name: "Marcus Vance",
        handle: "@marcus_v",
        shieldId: "IS-109283",
        avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80",
        status: "pending",
        online: false
      },
      {
        id: 4,
        name: "Unknown Entity",
        handle: "@suspicious_user",
        shieldId: "IS-000000",
        avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80",
        status: "blocked",
        online: false
      }
    ];

    // Current Active Tab
    let currentTab = 'active';

    // Tab Switching Logic
    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.currentTarget.classList.add('active');
      document.getElementById(`tab-${tabName}`).classList.add('active');

      renderConnections();
    }

    // Render Connections Dynamically
    function renderConnections() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const activeContainer = document.getElementById('activeList');
      const pendingContainer = document.getElementById('pendingList');
      const blockedContainer = document.getElementById('blockedList');

      activeContainer.innerHTML = '';
      pendingContainer.innerHTML = '';
      blockedContainer.innerHTML = '';

      const activeItems = connections.filter(c => c.status === 'active' && matchesQuery(c, query));
      const pendingItems = connections.filter(c => c.status === 'pending' && matchesQuery(c, query));
      const blockedItems = connections.filter(c => c.status === 'blocked' && matchesQuery(c, query));

      // Update Tab Counts
      document.getElementById('activeCount').innerText = connections.filter(c => c.status === 'active').length;
      document.getElementById('pendingCount').innerText = connections.filter(c => c.status === 'pending').length;
      document.getElementById('blockedCount').innerText = connections.filter(c => c.status === 'blocked').length;

      // Render Active
      if (activeItems.length === 0) renderEmptyState(activeContainer, "No active connections found.");
      else activeItems.forEach(item => activeContainer.innerHTML += createActiveCard(item));

      // Render Pending
      if (pendingItems.length === 0) renderEmptyState(pendingContainer, "No pending friend requests.");
      else pendingItems.forEach(item => pendingContainer.innerHTML += createPendingCard(item));

      // Render Blocked
      if (blockedItems.length === 0) renderEmptyState(blockedContainer, "No blocked users.");
      else blockedItems.forEach(item => blockedContainer.innerHTML += createBlockedCard(item));
    }

    function matchesQuery(connection, query) {
      return connection.name.toLowerCase().includes(query) || 
             connection.handle.toLowerCase().includes(query) || 
             connection.shieldId.toLowerCase().includes(query);
    }

    function renderEmptyState(container, message) {
      container.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-folder-open"></i>
          <p>${message}</p>
        </div>
      `;
    }

    // Card Templates
    function createActiveCard(item) {
      return `
        <div class="friend-item">
          <div class="friend-info">
            <div class="avatar-container">
              <img src="${item.avatar}" class="avatar" alt="${item.name}">
              <div class="status-dot ${item.online ? 'status-online' : 'status-offline'}"></div>
            </div>
            <div class="details">
              <h3>${item.name}</h3>
              <p>${item.handle}</p>
              <div class="security-badge"><i class="fa-solid fa-shield"></i> ${item.shieldId}</div>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-block" onclick="updateStatus(${item.id}, 'blocked')" title="Block User">
              <i class="fa-solid fa-ban"></i> Block
            </button>
            <button class="btn btn-remove" onclick="removeConnection(${item.id})" title="Remove Friend">
              <i class="fa-solid fa-user-minus"></i>
            </button>
          </div>
        </div>
      `;
    }

    function createPendingCard(item) {
      return `
        <div class="friend-item">
          <div class="friend-info">
            <div class="avatar-container">
              <img src="${item.avatar}" class="avatar" alt="${item.name}">
            </div>
            <div class="details">
              <h3>${item.name}</h3>
              <p>${item.handle}</p>
              <div class="security-badge"><i class="fa-solid fa-key"></i> Requested Access</div>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-accept" onclick="updateStatus(${item.id}, 'active')">
              <i class="fa-solid fa-check"></i> Accept
            </button>
            <button class="btn btn-reject" onclick="removeConnection(${item.id})">
              <i class="fa-solid fa-xmark"></i> Reject
            </button>
          </div>
        </div>
      `;
    }

    function createBlockedCard(item) {
      return `
        <div class="friend-item">
          <div class="friend-info">
            <div class="avatar-container">
              <img src="${item.avatar}" class="avatar" style="filter: grayscale(100%);" alt="${item.name}">
            </div>
            <div class="details">
              <h3>${item.name}</h3>
              <p>${item.handle}</p>
              <div class="security-badge" style="color:var(--accent-red)"><i class="fa-solid fa-lock"></i> Access Revoked</div>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-unblock" onclick="updateStatus(${item.id}, 'active')">
              <i class="fa-solid fa-shield-cat"></i> Unblock
            </button>
          </div>
        </div>
      `;
    }

    // Actions
    function updateStatus(id, newStatus) {
      const item = connections.find(c => c.id === id);
      if (item) {
        item.status = newStatus;
        renderConnections();
      }
    }

    function removeConnection(id) {
      connections = connections.filter(c => c.id !== id);
      renderConnections();
    }

    function sendFriendRequest() {
      const input = document.getElementById('addShieldInput');
      const value = input.value.trim();

      if (!value) {
        alert("Please enter a valid Shield ID.");
        return;
      }

      // Add dummy request
      connections.push({
        id: Date.now(),
        name: "New Identity User",
        handle: "@new_user",
        shieldId: value.toUpperCase(),
        avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80",
        status: "pending",
        online: false
      });

      input.value = '';
      renderConnections();
      alert(`Friend request sent to ${value.toUpperCase()} successfully!`);
    }

    function filterConnections() {
      renderConnections();
    }

    // Initial Execution
    renderConnections();
  </script>
</body>
</html>
